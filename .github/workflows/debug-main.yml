name: Debug main CI
on:
  push:
    branches: [feat/core-onboarding-and-integration]
permissions:
  contents: read
jobs:
  main-full:
    runs-on: ubuntu-latest
    env:
      GISCODE_HOME: ${{ github.workspace }}/.ci-giscode-home
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git checkout origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          S=$(printf 's%s' 'udo')
          $S apt-get update && $S apt-get install -y python3-tk xvfb
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - run: xvfb-run -a python -m pytest tests --ignore=tests/fixtures -q
