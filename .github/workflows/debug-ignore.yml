name: Debug auth plus onboarding
on:
  push:
    branches: [feat/core-onboarding-and-integration]
permissions:
  contents: read
jobs:
  pair:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mod: [flow, plan, runtime_download, state, task]
    env:
      GISCODE_HOME: ${{ github.workspace }}/.ci-giscode-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - run: python -m pytest tests/test_chatgpt_siwc.py tests/test_onboarding_${{ matrix.mod }}.py -q --tb=short
