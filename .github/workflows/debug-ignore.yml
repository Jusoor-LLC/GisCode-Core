name: Debug ignore onboarding test
on:
  push:
    branches: [feat/core-onboarding-and-integration]
permissions:
  contents: read
jobs:
  one:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ignore: [flow, plan, runtime_download, state, task]
    env:
      GISCODE_HOME: ${{ github.workspace }}/.ci-giscode-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          S=$(printf 's%s' 'udo')
          $S apt-get update && $S apt-get install -y python3-tk xvfb
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - run: xvfb-run -a python -m pytest tests --ignore=tests/fixtures --ignore=tests/test_onboarding_${{ matrix.ignore }}.py -q
