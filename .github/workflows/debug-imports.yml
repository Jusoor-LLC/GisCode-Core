name: Debug import probe
on:
  push:
    branches: [feat/core-onboarding-and-integration]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stop: [26, 50, 80, 110, 140, 160]
    env:
      GISCODE_HOME: ${{ github.workspace }}/.ci-giscode-home
      DEBUG_IMPORT_STOP: ${{ matrix.stop }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - run: python -m pytest tests/test_zzzz_debug_imports.py -q --tb=short
