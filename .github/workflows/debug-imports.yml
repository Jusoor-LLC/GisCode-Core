name: Debug import probe
on:
  push:
    branches: [feat/core-onboarding-and-integration]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GISCODE_HOME: ${{ github.workspace }}/.ci-giscode-home
      DEBUG_IMPORT_STOP: "160"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - run: xvfb-run -a python -m pytest tests/test_zzzz_debug_imports.py -q --tb=short
