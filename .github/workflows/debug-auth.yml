name: Debug auth CI
on:
  push:
    branches: [feat/core-onboarding-and-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-only:
    runs-on: ubuntu-latest
    env:
      GISCODE_HOME: ${{ github.workspace }}/.ci-giscode-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: auth only
        run: xvfb-run -a python -m pytest tests/test_chatgpt_siwc.py -q --tb=short
      - name: prefix-26
        run: xvfb-run -a python -m pytest $(ls tests/test_*.py | sort | head -26) -q --tb=short
